      - type: text
        name: "Scene: Exploring The Wreck"
        sort: 12000
        _id: 1E5OTwV2Al3iDJr0
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h2>Exploring The Wreck</h2>

            <p><b>Scene Type:</b> Core</p>
            <p>
              <b>Lead-Ins:</b>
              @UUID[.qPAsm6kx1rBmEhnd]{Getting to the Wreck}, @UUID[.nNHmG1QpD1TePp95]{The
              Squatter}
            </p>
            <p>
              <b>Lead-Outs:</b>
              @UUID[.1kA8rfeIt7NrLtZ3]{Thwarting the Haunter},
              @UUID[.QKmKYow0BTIoALfM]{The Cultists Arrive}
            </p>

            <p>
              Stepping onto the wreck is nerve-wracking – every movement and every breath of
              wind causes the structure to creak and groan. Inside, the <i>Belle’s</i>
              clearly in terrible shape – there’s debris and broken glass everywhere
            </p>
            <p>
              The <i>Belle’s</i> not merely wrecked – she’s barely holding together. The
              next big storm will doubtless tear her apart. Rain and spray from the waves
              has flooded much of the ship, so the Investigators must wade through
              ankle-deep rust-coloured water thick with debris.
            </p>
            <ul>
              <li>
                <b>Art History:</b> Some of that debris consists of paintings, books and
                <i>objets d’art</i> – all worthless now they’ve been so badly damaged by the
                floodwater.
              </li>
              <li>
                <b>(core clue) Occult:</b> The Investigators find a waterlogged grimoire.
                Most of it’s unreadable, but one section describes a ‘shining stone’ that is
                ‘the eye of Thoth-Hermes’ (aka thrice-great Hermes Trismegistus, the
                Hellenistic deity of esoteric knowledge). The grimoire urges the stone to be
                kept in the ‘casket of darkness’.
              </li>
              <li>
                <b>Architecture</b> or <b>Notice:</b> There was a secret compartment in the
                bilge of the ship, but it was smashed open by the impact. It’s likely that
                most of the art objects were hidden here.
              </li>

              <li>
                <b>(core clue) Physics</b> or <b>Geology:</b> A close examination of the
                hull discovers that the ship’s not merely impaled on the rocks – it’s as
                though the metal has <i>fused</i> with the stone, interwoven with it. (The
                <i>Belle</i> phased out of our reality and then slipped back, which is how
                it ended up on these rocks.)
              </li>
            </ul>

            <p>
              The boat is extremely precariously balanced – one strong impact could cause it
              to slide off the rocks and sink.
            </p>

            <h3>Finding the Gemstone</h3>

            <p>
              The gemstone’s only partly in our dimension. When the casket holding it broke
              open, it warped space around it, stranding the <i>Belle</i> on the cliffs –
              then it passing through the hull to merge with the rocks below. It’s currently
              lodged under the ship, half-embedded in the stone. Extracting it requires a
              few minutes’ work with a screwdriver or other prying tool.
            </p>

            <p>The gemstone’s hot to the touch (in fact, it’s radioactive).</p>

            <ul>
              <li><b>Physics</b> can locate the stone with a Geiger counter.</li>
              <li>
                Climbing under the ship with <b>Geology</b> and a flashlight spots the
                warped stone.
              </li>
            </ul>
            <p>
              Failing all that, <b>Notice</b> spots an unnatural glow when the Haunter
              manifests.
            </p>

            <h3>@UUID[Actor.FzXDeCFYN5wBwwTG]{The Haunter of the Wreck}</h3>
            <p>
              The Haunter is an extradimensional entity, drawn to the space-warp created by
              the gemstone. The Haunter manifests as a hideous amalgam of bat and serpent
              and insect, all limned in electric blue fire. It’s not composed of terrestrial
              matter, so bullets and other attacks can’t affect it, but it can feed on the
              life force of humans. So far, it’s spared Willett in favour of more nutritious
              victims.
            </p>
            <p>
              Unlike the Haunter of the Dark, the Haunter of the Wreck can tolerate some
              light, although intensely bright light drives causes it to flee, so it only
              manifests at night or in enclosed, shaded spaces (like the interior of the
              <i>Belle</i>).
            </p>
            <p>
              The Haunter manifests when the sun goes down or if the investigators start
              meddling with the gemstone. It can’t stray far from the gemstone, and loses 1
              Health every round when it’s more than a few metres away from it.
            </p>

            <p>
              On seeing the Haunter, all investigators must make Stability tests (Difficulty
              5). Fail, and lose 6 Stability. Characters reduced to 0 Stability by this
              sight are shaken (+1 to all Difficulty numbers) and lose a point of Sanity.
            </p>
