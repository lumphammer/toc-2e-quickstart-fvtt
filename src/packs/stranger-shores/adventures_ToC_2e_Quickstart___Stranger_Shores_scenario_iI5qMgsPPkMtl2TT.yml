      - type: text
        name: Trail of Cthulhu 2nd Edition
        sort: 1400000
        _id: BnhwOnEAtBgwZp3j
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h1>
              <span>Trail of Cthulhu 2</span><sup>nd</sup>
              Edition
            </h1>

            <blockquote>
              “Cthulhu still lives … in that chasm of stone which has shielded him since the
              sun was young. His accursed city is sunken once more … but his ministers on
              Earth still bellow and prance and slay around idol-capped monoliths in lonely
              places. He must have been trapped by the sinking whilst within his black
              abyss, or the world would by now be screaming with fright and frenzy. Who
              knows the end? What has risen may sink, and what has sunk may rise.
              Loathsomeness waits and dreams in the deep, and decay spreads over the
              tottering cities of men. A time will come …”
            </blockquote>

            <p>
              In
              <b><i>Trail of Cthulhu</i></b>
              2nd edition, your Investigators are pitted against the horrors of the Cthulhu
              Mythos, based on the works of HP Lovecraft and his disciples. The Mythos
              posits that our understanding of the universe is an arrogant delusion, that we
              cannot bear the truth – we are insects next to the Great Old Ones who once
              ruled Earth, and shall return when the stars come right.
            </p>

            <p>
              Your Investigators will face alien gods, monstrous servitors, sinister cults,
              immortal necromancers and perils for which there is no earthly name, no human
              conception. These horrors might be anywhere, from the remotest unexplored
              regions of Earth or dimensions that border on our reality only tangentially –
              or at your very door, in your family ancestry or clawing their way into your
              dreams. Ia! Their hand is at your throat, though you see them not!
            </p>

            <p>
              You’ll find traces and hints in occult tomes, in myths and legends that caught
              fragments of primordial truth. Follow the trail of clues and face the terrible
              revelation – or flee and take refuge in blissful ignorance...
            </p>
            <p>
              The
              <b><i>Trail of Cthulhu</i></b>
              2nd edition rulebook describes the gods and monsters of the Mythos, along with
              a veritable forbidden library of grimoires and blasphemous texts. For each
              entity, we give a host of possible interpretations, variations and heresies,
              firing the imaginations of Game Moderators and ensuring that even veteran
              players experience the chilling dread of the unknown.
            </p>
            <p>
              This new edition adds more gods and monsters to the roster – the dreadful
              Black Winged Ones, Hound-Liches, sinister Revenants, the folklore-inspired
              Tylwyth Corachaidd, the alien Ultraviolet Devourers, Worm-Wizards and other
              horrors, as well as expanded rules for creating your own creatures.
            </p>
            <p>
              A revised magic system incorporates the rules from the 1st edition
              <i>Rough Magicks</i>
              supplement, adds a new Magic ability, and updates the various spells and
              rituals in the Mythos grimoires to match.
              <b><i>Trail of Cthulhu</i></b>
              2nd Edition also expands the use of the Cthulhu Mythos ability, giving
              Investigators who are already corrupted a way to glean unnatural insights and
              sense the presence of the Mythos.
            </p>
            <p>
              Binding it all together – new advice and notes on creating Lovecraftian
              scenarios and campaigns in the expanded Gamemastering chapter.
            </p>

            <h3>For new players!</h3>
            <p>
              Powered by the GUMSHOE engine,
              <b><i>Trail of Cthulhu</i></b>
              is designed to make investigation and mysteries run smoothly, by putting the
              emphasis on the players’ deductions and ingenuity instead of relying on lucky
              rolls.
            </p>
            <p>Inside the rulebook you’ll find:</p>
            <ul>
              <li>Quick and easy character generation</li>
              <li>Simple but compelling rules for action scenes</li>
              <li>A guide to the Cthulhu Mythos</li>
              <li>A guide to the 1930s setting</li>
              <li>Comprehensive gamemastering and player advice</li>
              <li>Suggested campaign frameworks and two sample scenarios</li>
            </ul>

            <h3>For existing players!</h3>

            <p>
              <b><i>Trail of Cthulhu</i></b>
              2nd Edition is wholly compatible with all 1st edition supplements and
              adventures – if you’ve already played 1st edition, you’ll be right at home.
              But we’ve taken the lessons and experiences of fifteen years of play to
              clarify some points, hone the rules and improve the rulebook.
            </p>

            <p>Changes from the 1st edition include:</p>
            <p></p>

            <ul>
              <li>
                A revised and simplified character creation system with easy-to-use
                templates.
              </li>
              <li>
                Investigative ability spends clarified, expanded and brought up to
                state-of-the-art GUMSHOE
              </li>
              <li>Clearer rules for contests, combat, injury and stress</li>
              <li>An expanded and revised guide to the Mythos</li>
              <li>
                Two new campaign frames! Play small-town folk suddenly become neighbors with
                the uncanny Beneath Unknown Skies! Pit your tommy-guns against the Mythos
                amidst the Shadows Under Chicago!
              </li>
              <li>
                Expanded GM advice! New essays on the elements of Lovecraftian fiction, on
                the Maze of Clues vs the Ocean of Clues styles of mystery-making, on
                one-shot adventures, on campaigns and more!
              </li>
              <li>
                Two new introductory adventures! Stop the Nazis from reaching a primordial
                artifact in “The Hammer of the Gods,” and sift through the ashes of a
                disastrous seance in “Afterlight”
              </li>
            </ul>

            <img src="modules/toc-2e-quickstart/assets/Portal_gold.webp">
