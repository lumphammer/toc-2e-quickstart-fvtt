      - type: text
        name: "Scene: Background Research"
        sort: 5000
        _id: GvSSDACo0XHoG4N7
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <h2>Background Research</h2>

            <p> <b>Scene Type:</b> Alternate </p>

            <p> <b>Lead-Ins:</b> @UUID[.eD7EBK0ylZwjBsth]{Starting the
            Adventure} </p>

            <p>
              <b>Lead-Outs:</b>
              @UUID[.qPAsm6kx1rBmEhnd]{Getting to the Wreck},
              @UUID[.4y3RK24iss3BAgkg]{Sinister Watcher}
            </p>

            <p>
              There’s plenty of potential investigative legwork to do before heading out to
              the wreck.
            </p>


            <ul>
              <li>
                <b>Library Use:</b> The freighter <i>Belle</i>
                ran aground two months ago. She had a crew of six; four of them, including
                Captain Lews, are still missing and believed drowned, as only two bodies
                were found on board.
              </li>
            </ul>


            <aside>
              <h4>The Haunter of the Dark</h4>
              <p>
                This adventure is inspired by Lovecraft’s story “The Haunter of the Dark”,
                which features a similar gemstone. The mysterious cult employing the law
                firm in Providence is the same Starry Wisdom sect that fled the town in
                1877.
              </p>
              <p>
                If you want to get into the right mood to run <i>Trail,</i> the best thing
                to do is reread some Lovecraft.
              </p>
            </aside>

            <ul>
              <li>
                <strong>Oral History:</strong> Ever since the <i>Belle</i> ran aground,
                there have been rumours of strange lights at night. Most likely beachcombers
                and salvagers, but there are wild stories about ghosts. Why, haven’t you
                heard that everyone on board was dead when the ship was found?
                <ul>
                  <li>
                    <b>1 - point Oral History</b> spend: The rumour is that the ship must
                    have been deliberately run aground – how else could it have ended up on
                    those rocks?
                  </li>
                </ul>
              </li>
              <li>
                <strong>Streetwise:</strong> The <i>Belle</i> was a rum-runner during
                Prohibition, smuggling whiskey from Canada. After repeal, Captain Lews fell
                on hard times; it’s rumoured he was in debt to the Mob. Perhaps he ran the
                <i>Belle</i> onto the rocks deliberately, as an insurance scam?
              </li>
              <li>
                <b>Law:</b> The ownership of the<i>Belle</i> – and responsibility for
                dealing with the wreck – are a matter of some dispute. Apparently, some
                expensive law firm in Providence, Bell, Phibbs &amp; Co., has intervened to
                keep the local commissioner of wrecks from taking anything off
                the<i>Belle</i>. That firm suggests old money – and a desire for privacy.
              </li>
              <li>
                <b>Criminology</b>
                convinces the local police to give the Investigators a look at the log of
                the <i>Belle</i>; the entries are suspiciously unremarkable, apart from a
                note describing an outbreak of sickness among the crew a day before the
                shipwreck.
              </li>
              <li>
                <b>1-point Occult</b> or <b>Oral History</b> spend: This all brings back
                memories of the unpleasantness with the Starry Wisdom sect, who were a
                strange church in Providence about 50 years ago. They worshipped some
                crystal they brought out of Egypt, and there were tales of devil bats and
                disappearances. They got run out of town back in 1877 or so. (See
                Lovecraft’s “The Haunter of the Dark” for a fuller history.)
              </li>
            </ul>


            <p>
              Pick a random Investigator in this scene to make a <b>Sense Trouble</b> test
              (Difficulty 5). If successful, the investigator realizes they’re being watched
              by a tough-looking guy in a trenchcoat. (A 1-point <b>Streetwise</b> or
              <b>Criminology</b> spend recognizes him as Lou Feschi, a Boston-based private
              investigator.) If they confront him, run <i>Sinister Watcher</i>.
            </p>
