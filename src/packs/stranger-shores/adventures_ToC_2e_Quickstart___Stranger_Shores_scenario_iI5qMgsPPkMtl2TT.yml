      - type: text
        name: "Scene: The Cultists Arrive"
        sort: 14000
        _id: QKmKYow0BTIoALfM
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h2>The Cultists Arrive</h2>

            <p><b>Scene Type:</b> Antagonist Action</p>
            <p>
              <b>Lead-Ins:</b>
              @UUID[.1E5OTwV2Al3iDJr0]{Exploring The Wreck}
            </p>
            <p>
              <b>Lead-Outs:</b>
              @UUID[.1kA8rfeIt7NrLtZ3]{Scene: Thwarting the Haunter}
            </p>

            <p>
              As an optional complication, four members of the Starry Wisdom cult show up at
              the wreck just before sunset. All four are dressed in understated suits, and
              drive a Packard touring car; they could be travelling salesmen. They all have
              ordinary, respectable jobs by day; by night, they worship the Old Ones, and
              are here to reclaim the gemstone that opens the gate of visions.
            </p>
            <p>
              Depending on how the <i>@UUID[.4y3RK24iss3BAgkg]{Sinister Watcher}</i> scene
              played out, the cultists may expect the only obstacle to be one disposable
              hobo (Thomas Willett, whose body can be dumped in the water and no-one will
              care) or they may be ready to meet the investigators (in which case, they
              carry rifles). However, the cultists are both subtle and patient; they want to
              recover the gemstone as quietly as possible. Their sect was driven out of
              Providence in 1877, and they still remember that painful setback.
            </p>
            <p>
              The cultists know about the box and the protocol for safely storing the
              gemstone; it’s possible for the investigators to talk their way out if they’re
              willing to hand over the terribly potent gemstone to the cult, over Willett’s
              objections. More likely, the investigators must find some way to escape the
              cultists while denying them the gemstone.
            </p>

            <h4>Nameless Cultists of the Starry Wisdom Sect</h4>

            <ul>
              <li>@UUID[Actor.37wvwgv9iAj0D091]{Nameless Cultist 1}</li>
              <li>@UUID[Actor.nRW0Iautm1ejIFyr]{Nameless Cultist 2}</li>
              <li>@UUID[Actor.Z5S3QCMm7fNqnkHl]{Nameless Cultist 3}</li>
              <li>@UUID[Actor.HAsFiZS044CFkNQ7]{Nameless Cultist 4}</li>
            </ul>
