      notes:
        format: richText
        source: ""
        html: ""
      gmNotes:
        format: richText
        source: >-
          <p><strong>Intimidation </strong>(or <strong>Bargain </strong>and a
          bribe) gets some information out of him:</p>

          <ul>

          <li>His orders are to report anyone asking questions about the wreck.
          The law firm gave him a telephone number to ring. It was a
          long-distance number, to<br>California.

          <ul>

          <li><strong>Assess Honesty</strong>: Feschi intends to report his
          encounter with the investigators to his mysterious employers.</li>

          </ul>

          </li>

          <li>He&rsquo;s already called the number once &ndash; to report some
          hobo squatting in the wreck (<em>The Squatter</em>). Whoever answered
          the phone spoke in a strange whisper, and all they said was that they
          would take care of it soon. The voice unsettled Feschi, but he&rsquo;s
          too much of a pro (and needs the money too much)&nbsp;to let it bother
          him.</li>

          <li>He got the impression that someone else was coming to deal with
          the wreck.</li>

          <li>He tried shooing the hobo away from the wreck, but the rocks
          looked slippery and precarious and he didn&rsquo;t want to risk a
          fall. And, honestly, he doubts the&nbsp;wreck&rsquo;s going to last
          much longer. A pity &ndash; he could do with this job lasting a few
          days longer.</li>

          </ul>

          <p>After encountering the Investigators, Feschi telephones the number
          he was given and reports the meeting. This likely precipitates <em>The
          Cultists Arrive</em> at the end of the scenario. The PCs can compel
          Feschi to keep quiet with a suitable <strong>Interpersonal</strong>
          spend.</p>

          <p>&nbsp;</p>
        html: >-
          <p><strong>Intimidation </strong>(or <strong>Bargain </strong>and a
          bribe) gets some information out of him:</p>

          <ul>

          <li>His orders are to report anyone asking questions about the wreck.
          The law firm gave him a telephone number to ring. It was a
          long-distance number, to<br>California.

          <ul>

          <li><strong>Assess Honesty</strong>: Feschi intends to report his
          encounter with the investigators to his mysterious employers.</li>

          </ul>

          </li>

          <li>He’s already called the number once – to report some hobo
          squatting in the wreck (<em>The Squatter</em>). Whoever answered the
          phone spoke in a strange whisper, and all they said was that they
          would take care of it soon. The voice unsettled Feschi, but he’s too
          much of a pro (and needs the money too much)&nbsp;to let it bother
          him.</li>

          <li>He got the impression that someone else was coming to deal with
          the wreck.</li>

          <li>He tried shooing the hobo away from the wreck, but the rocks
          looked slippery and precarious and he didn’t want to risk a fall. And,
          honestly, he doubts the&nbsp;wreck’s going to last much longer. A pity
          – he could do with this job lasting a few days longer.</li>

          </ul>

          <p>After encountering the Investigators, Feschi telephones the number
          he was given and reports the meeting. This likely precipitates <em>The
          Cultists Arrive</em> at the end of the scenario. The PCs can compel
          Feschi to keep quiet with a suitable <strong>Interpersonal</strong>
          spend.</p>

          <p>&nbsp;</p>
