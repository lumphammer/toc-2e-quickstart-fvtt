      - type: text
        name: Introduction
        sort: 300000
        _id: G2iU4PCYXKCr8RPw
        system: {}
        title:
          show: false
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h1>Introduction</h1>
            <blockquote>
              <p>
                In the mists of prehistory, alien gods and monsters fell to Earth and warred
                over our planet, unleashing cosmic science and inconceivable powers until
                continents sank and seas boiled. Exhausted or defeated, They fell into an
                aeons- long slumber, and the human race obliviously goes about its business
                over Their tombs. But there are those who want to seek out the fragments of
                the lore They left behind. Those who want to learn the secrets of the stars,
                and the true names of the dimensions to gain the dead gods’ powers. Those
                want to wake Them up.
              </p>
              <p>
                You are among the few brave souls who know the truth – about the mad gods at
                the center of the universe, about the Great Old Ones who will uncaringly
                obliterate the Earth, about the ancient legends of undying evil that are all
                coming true. You must make sure nobody ever finds out -- or the world will
                wake up screaming.
              </p>
              <p>
                You have to keep the doors to the Outside from swinging open – no matter
                what the cost in life or sanity. You have to piece together clues from books
                bound in human skin, from eviscerated corpses covered in ichor, and from
                inscriptions carved on walls built before humanity evolved. You have to go
                wherever the answers are and do what needs to be done.
              </p>
              <p>Do YOU dare to follow... the trail of Cthulhu?</p>
            </blockquote>
            <p>
              <i>Trail of Cthulhu</i>
              is a GUMSHOE-powered game of occult investigation and cosmic horror. So, what
              does all that mean?
            </p>
            <h2>What’s GUMSHOE?</h2>
            <p>
              GUMSHOE is a beginner-friendly rules system which makes investigative tabletop
              roleplaying games more fun. The core idea of GUMSHOE is that it’s always more
              enjoyable when the Game Moderator (GM) can give the players the information
              they need to solve a mystery, so the players can piece the clues together and
              proceed based on their deductions.
            </p>
            <p>
              For more about how GUMSHOE works, see
              @UUID[.G2iU4PCYXKCr8RPw#gumshoe-for-players]{GUMSHOE for Players} and
              @UUID[.G2iU4PCYXKCr8RPw#gumshoe-for-game-moderators]{GUMSHOE for Game
              Moderators}.
            </p>
            <h2>What’s Occult Investigation?</h2>
            <p>
              In
              <i>Trail of Cthulhu</i>
              , you take on the role of an Investigator. You might be a detective, or a
              plucky reporter, an archaeologist, or a scientist – but whatever your
              profession, you are an inquisitive soul in search of terrible truths.
              <i>Trail of Cthulhu</i>
              ’s default setting is the tumultuous decade of the 1930s – the decade of
              Indiana Jones and Sam Spade, but also the Great Depression and the Second
              World War. For a sample Investigator, see
              @UUID[Actor.NwI6OjBHmiNzbhfS]{Dashwood} (or the equivalent print character
              sheet: @UUID[.ZJKncwxk1NCAbwZq]{Sample Character Sheet} .)
            </p>
            <h2>What’s Cosmic Horror?</h2>
            <p>
              Trail of Cthulhu is inspired by the Cthulhu Mythos of H. P. Lovecraft and his
              literary descendants like Robert E. Howard and August Derleth. Alien gods and
              eldritch entities wait for the stars to come right; nefarious cults and
              sinister sorcerers lurk in the shadows. Trail of Cthulhu can be played in one
              of two modes: Purist for players who enjoy the nihilistic thrill of watching
              their Investigators spiral into despair and madness, and Pulp for those who
              want to pit tommy guns and dynamite against the Mythos! For more about cosmic
              horror, see @UUID[.BnhwOnEAtBgwZp3j]{Trail of Cthulhu 2nd Edition}.
            </p>
            <aside>
              <h2>What’s New In 2nd Edition?</h2>
              <p>
                If you’re already familiar with Trail’s award-winning 1st edition, skip to
                @UUID[.BnhwOnEAtBgwZp3j#for-existing-players!]{For existing players!} for
                the inside scoop on what’s changed in the new incarnation.
              </p>
            </aside>

            <h2>GUMSHOE for Players</h2>
            <p>
              In
              <i>Trail of Cthulhu</i>
              (and other GUMSHOE games), your character has two types of abilities –
              <b>Investigative abilities</b>
              and
              <b>General abilities.</b>
            </p>

            <p>
              <b>
                Investigative abilities
                <i>always</i>
                work. If there’s a clue to be found, and you have the right ability, you get
                the information.
              </b>
            </p>

            <li>
              For example, if you’ve got
              <b>Library Use,</b>
              and you ask, ‘Can my Investigator find anything in the university library
              about the wreck of the Belle?’, then the GM says ‘yes, you find this old
              newspaper cutting...
            </li>

            <aside>
              <h2>FREAK WAVE CAUSES FATAL SHIPWRECK</h2>
              <p>
                Investigators have concluded that the wrecking of the freighter Belle was
                the result of misadventure and cannot be attributed to negligence on the
                part of the crew. It seems that an unusually powerful wave drove the ship
                high onto the rocks near Brenton Point, and the impact was cause of death
                for at least two members of the crew. Another four are presumed drowned.
                Although the weather on the night in question was relatively calm, Professor
                Algincourt of Brown University testified to the existence of sudden
                ‘rogue waves’
              </p>
            </aside>

            <p>
              There’s no dice to roll, no chance you’ll miss a clue - but how you
              <i>interpret</i>
              and use that clue to solve the overall mystery is up to you.
            </p>
            <p>
              The number of points you have in an Investigative ability is called a
              <b>pool,</b>
              and you can
              <b>spend points</b>
              from your pool for extra information, or added benefits.
            </p>
            <p style="margin-left:25px">
              <i>
                For example, spending a point from your Library Use pool might let you find
                another book listing the occurrences of similar freak waves, or convince the
                elderly librarian to share her recollections of the Waite family.
              </i>
            </p>
            <p>
              <b>General abilities</b>
              , by contrast, are what you use when the possibility of failure would be
              narratively interesting. They’re used for combat and perilous, uncertain
              situations, and you use them in a
              <b>test</b>
              . You spend as many points as you wish from the relevant General ability pool,
              then roll a six-sided die (d6). If the total of your spend + the die roll
              equals or exceeds the Difficulty (typically 4+), you succeed!
            </p>
            <p style="margin-left:25px">
              <i>
                For example, you’re careening around a mountainous path in a beat-up old
                car, trying to escape an eldritch horror. You spend 3 points from your
                Driving pool, then roll a d6. You roll a 2 which, added to your 3-point
                spend gives a total of 5, exceeding the Difficulty of 4, so your character
                succeeds in keeping the car on the road and escaping.
              </i>
            </p>
            <p>It’s really that simple.</p>
            <p>
              In combat, the Difficulty for attacks using Scuffling, Firearms or Weapons is
              determined by the target’s Hit Threshold. On a hit, damage is determined by
              rolling a die and applying the weapon’s Damage Modifier (-2 for a fist, +0 to
              +2 for most weapons).
            </p>
            <p>
              Damage gets subtracted from the target’s Health; player characters are Hurt at
              0, Seriously Wounded at -6 and Dead at -12. Game Moderator Characters (GMCs)
              are usually out of the fight if reduced to 0 Health.
            </p>

            <h2>GUMSHOE for Game Moderators</h2>

            <p>
              On the GM’s side of the game, Investigative abilities mean you can design more
              complex and compelling mysteries. You don’t need to worry about the players
              missing vital information because of an unlucky die roll.
            </p>
            <p>
              Additionally, each of the characters has a
              <b>Drive</b>
              , a reason for them to look into the mystery, which you can use to encourage
              hesitant players to take part in the investigation.
            </p>
            <p>
              <i>Trail of Cthulhu</i>
              provides a straightforward structure for adventure design, broken down into a
              series of
              <b>scenes</b>
              so you can more easily plot the flow of information:
            </p>

            <h3>The Hook:</h3>

            <ul>
              <li>
                The instigating incident that gets the characters involved in the mystery.
              </li>
            </ul>

            <h3>The Scenario Spine:</h3>
            <ul>
              <li>
                A series of roleplayed scenes, set in locations and featuring GM characters
                (GMCs), from which the Investigators collect clues to help them solve the
                mystery.
              </li>
            </ul>

            <h3>The Horrible Truth:</h3>
            <ul>
              <li>The terrible reveal awaiting the players at the adventure’s end.</li>
            </ul>

            <p>
              <b>Core clues</b>
              link scenes in the adventure, ensuring the Investigators always have a clear
              path forward to the ending.
            </p>

            <h2>Sample Investigators</h2>
            <p>
              @UUID[Actor.NwI6OjBHmiNzbhfS]{Here’s archaeologist Dashwood’s character
              sheet}. You can create a blank character from the sidebar if you have
              permission. A full set of pre-generated characters are also included:
            </p>

            <ul>
              <li>@UUID[Actor.LDZ7EpQA2C5BAti4]{“The Archaeologist”}</li>
              <li>@UUID[Actor.pZ7gP9rsIhaE0H5l]{“The Author”}</li>
              <li>@UUID[Actor.c7kwKlYhbWG5r30G]{“The Dilettante”}</li>
              <li>@UUID[Actor.pzCS9hTzz6oFmx0f]{“The Doctor”}</li>
              <li>@UUID[Actor.P2jIkyisahIkdMSQ]{“The Hobo”}</li>
              <li>@UUID[Actor.Ql7WaV1EmBVfSwY0]{“The Private Detective”}</li>
            </ul>

