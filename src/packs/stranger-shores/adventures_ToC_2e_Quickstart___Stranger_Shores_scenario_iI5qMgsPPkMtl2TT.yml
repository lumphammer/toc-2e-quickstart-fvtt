        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h1>Stranger Shores</h1>
            <p>
              The freighter
              <em>Belle</em>
              ran aground on the rocky shore near Brenton Point, Rhode Island two months
              ago. There were no survivors, and the ship’s remained perched on the rocks
              ever since as the authorities argue over who’s responsible for removing the
              wreck. While they bicker, something unwholesome is festering on board the
              rotting ship...
            </p>
            <h3>The Hook</h3>
            <p>
              Mysterious events trouble the area around the wreck of the
              <em>Belle.</em>
            </p>
            <h3>Scenario Spine</h3>
            <p>
              Once the GM has finished
              <em>Starting the Adventure,</em>
              the Investigators can do some
              <em>Background Research</em>
              into the shipwreck of the
              <em>Belle.</em>
              While they are Getting to the Wreck, they spot a strange item,
              <em>The Box.</em>
              On the wreck, the Investigators meet
              <em>The Squatter,</em>
              the brother of one of the drowned sailors. They can then spend time
              <em>Exploring the Wreck,</em>
              and end up
              <em>Finding the Gemstone,</em>
              which results in the manifestation of
              <em>The Haunter of the Wreck.</em>
              The Investigators are then left
              <em>Thwarting the Haunter.</em>
            </p>
            <p>
              An optional subplot involves a
              <em>Sinister Watcher</em>
              which can lead to
              <em>The Cultists Arrive.</em>
            </p>
            <h3>The Horrible Truth</h3>
            <p>
              The
              <em>Belle</em>
              was smuggling the collection of a mysterious occult society, including a
              magical gemstone that can tear open the barriers between dimensions. When this
              shining trapezohedron was accidentally removed from its proper container, it
              distorted space and time, resulting in the
              <em>Belle</em>
              crashing on the cliff and fusing with the rock. Until the gem’s returned to
              its casket, the distortions will continue to grow worse – releasing alien
              horrors into our world.
            </p>
            <p>
              Pre-generated characters for this adventure are provided. They are complete
              apart from a character name:
            </p>

            <ul>
              <li>@UUID[Actor.LDZ7EpQA2C5BAti4]{“The Archaeologist”}</li>
              <li>@UUID[Actor.pZ7gP9rsIhaE0H5l]{“The Author”}</li>
              <li>@UUID[Actor.c7kwKlYhbWG5r30G]{“The Dilettante”}</li>
              <li>@UUID[Actor.pzCS9hTzz6oFmx0f]{“The Doctor”}</li>
              <li>@UUID[Actor.P2jIkyisahIkdMSQ]{“The Hobo”}</li>
              <li>@UUID[Actor.Ql7WaV1EmBVfSwY0]{“The Private Detective”}</li>
            </ul>
