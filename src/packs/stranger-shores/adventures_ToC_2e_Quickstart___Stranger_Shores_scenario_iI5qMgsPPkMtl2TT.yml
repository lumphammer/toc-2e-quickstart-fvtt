      - type: text
        name: "Scene: The Squatter"
        sort: 10000
        _id: nNHmG1QpD1TePp95
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h2>The Squatter</h2>
            <p><b>Scene Type:</b> Alternate</p>
            <p>
              <b>Lead-Ins:</b>
              @UUID[.4y3RK24iss3BAgkg]{Sinister Watcher}, @UUID[.qPAsm6kx1rBmEhnd]{Getting
              to the Wreck}
            </p>
            <p>
              <b>Lead-Outs:</b>
              @UUID[.1E5OTwV2Al3iDJr0]{Exploring The Wreck}
            </p>

            <p>
              Living on the wreck is an eccentric hobo, <b>@UUID[Actor.YAQHqb1MVmCiemST]{Thomas Willett}</b>. He tries to
              drive the Investigators away if they approach, hurling first abuse, then
              rocks. Any suitable ability (<b>Intimidation, Reassurance , Streetwise</b>)
              calms him down and convinces him to talk.
            </p>

            <ul>
              <li>
                <b>Medicine:</b> Willett’s clearly unwell – open sores, bleeding gums, and
                odd burn marks on his skin. His symptoms are consistent with radiation
                poisoning.
              </li>
            </ul>
            <p>
              Conversations with Thomas are rambling, confused and contradictory. He’s
              obviously unwell. The investigators can salvage the following information from
              Thomas:
            </p>
            <ul>
              <li>
                Thomas’ brother Sam was one of the crew of the <i>Belle</i>. One of the
                drowned ones, he adds, not the two that were found dead.
              </li>
              <li>Thomas believes that Sam’s still alive – or will be coming back.</li>
              <li>
                Last time he saw Thomas, Sam told him that the <i>Belle</i>
                had been hired to transport an art collection from Europe. Stolen, Sam
                guessed, as they were told to smuggle it past the coastguard. Captain Lews
                told Sam the jewel of the collection was literally that – a ruby as big as a
                man’s fist!
              </li>
              <li>
                Thomas had a dream about Sam calling for help on the night the
                <i>Belle</i>
                went aground. Thomas jumped on a train heading east as soon as he could.
                He’s convinced there’s treasure on board.
              </li>
            </ul>
            <p>
              If the Investigators persuade Thomas they can be trusted, he confides that
              Sam’s ghost still talks to him, urging him to find the treasure.
            </p>
            <p>
              He’s also seen “the devil” appear at night – a figure made of blue flame. This
              is <i>@UUID[Actor.FzXDeCFYN5wBwwTG]{The Haunter of the Wreck}</i>.
            </p>
