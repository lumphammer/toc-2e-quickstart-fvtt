        text:
          format: 1
          content: |-
            <h2>Getting to the Wreck</h2>
            <p><b>Scene Type:</b> Core</p>
            <p>
              <b>Lead-Ins:</b>
              @UUID[.eD7EBK0ylZwjBsth]{Starting the Adventure},
              @UUID[.GvSSDACo0XHoG4N7]{Background Research},
              @UUID[.4y3RK24iss3BAgkg]{Sinister Watcher}
            </p>
            <p>
              <b>Lead-Outs:</b>
              @UUID[.GpbqYksMR8b5TOOz]{The Box}, @UUID[.nNHmG1QpD1TePp95]{The Squatter},
              @UUID[.1E5OTwV2Al3iDJr0]{Exploring The Wreck}
            </p>

            <p>
              If the investigators didn’t spot Lou Feschi during
              <i>@UUID[.GvSSDACo0XHoG4N7]{Background Research}</i>, then they get
              another chance here – Feschi might be watching the investigators through
              binoculars. Again, <b>Sense Trouble</b> (Difficulty 5) spots his car. If the
              investigators confront him, run
              <i>@UUID[.4y3RK24iss3BAgkg]{Sinister Watcher}</i>.
            </p>

            <p>
              The <i>Belle’s</i> lodged on a rocky outcrop, well above the high water mark.
              To get to the ship, the Investigators need to climb across a narrow spur of
              stone, with a sheer drop to the crashing waves below.
            </p>

            <ul>
              <li>
                <b>(core clue) Notice:</b> Down at the bottom of the cliffs, washed by the
                waves, is what looks like an ornate metal box – more debris from the
                shipwreck, no doubt. See <i>@UUID[.GpbqYksMR8b5TOOz]{The Box}</i>.
              </li>
              <li>
                A successful <b>Sense Trouble</b> test (Difficulty 4) spots that the wreck’s
                occupied (see <i>@UUID[.nNHmG1QpD1TePp95]{The Squatter}</i>).
              </li>
            </ul>

            <p>
              Crossing the spur requires an <b>Athletics</b> test (Difficulty 4); failure
              means the Investigator nearly falls, losing 2 Health or 2 Stability (player’s
              choice).
            </p>
