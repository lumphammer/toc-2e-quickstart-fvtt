      - type: text
        name: "Scene: Sinister Watcher"
        sort: 6000
        _id: 4y3RK24iss3BAgkg
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: >-
            <h2>Sinister Watcher</h2>

            <p><b>Scene Type:</b> Alternate</p>

            <p><b>Lead-Ins:</b> @UUID[.GvSSDACo0XHoG4N7]{Background
            Research}</p>

            <p>
              <b>Lead-Outs:</b> @UUID[.qPAsm6kx1rBmEhnd]{Getting to the Wreck},
              @UUID[.nNHmG1QpD1TePp95]{The Squatter}
            </p>

            <p>
              Two-bit gumshoe Lou Feschi was hired by a Providence law firm to keep an eye
              on the wreck – and watch out for people asking questions about it. He has no
              idea <i>why</i> the law firm’s interested in the wreck, but they’re paying him
              handsomely to do so.
            </p>

            <p>
              If the investigators confront him, he tries to stonewall them – and turns
              violent if restrained
            </p>

            <h3>@UUID[Actor.rTWFzA8JYZburEL4]{Lou Feschi, Cheap Detective}</h3>

            <p>
              <b>Intimidation</b> (or <b>Bargain</b> and a bribe) gets some information out
              of him:
            </p>

            <ul>
              <li>
                His orders are to report anyone asking questions about the wreck. The law
                firm gave him a telephone number to ring. It was a long-distance number, to
                California.
                <ul>
                  <li>
                    <b>Assess Honesty:</b>
                    Feschi intends to report his encounter with the investigators to his
                    mysterious employers.
                  </li>
                </ul>
              </li>
              <li>
                He’s already called the number once – to report some hobo squatting in the
                wreck (<i>@UUID[.nNHmG1QpD1TePp95]{The Squatter}</i>). Whoever answered the
                phone spoke in a strange whisper, and all they said was that they would take
                care of it soon. The voice unsettled Feschi, but he’s too much of a pro (and
                needs the money too much) to let it bother him.
              </li>
              <li>
                He got the impression that someone else was coming to deal with the wreck.
              </li>
              <li>
                He tried shooing the hobo away from the wreck, but the rocks looked slippery
                and precarious and he didn’t want to risk a fall. And, honestly, he doubts
                the wreck’s going to last much longer. A pity – he could do with this job
                lasting a few days longer.
              </li>
            </ul>


            <p>
              After encountering the Investigators, Feschi telephones the number he was
              given and reports the meeting. This likely precipitates
              <i>@UUID[.QKmKYow0BTIoALfM]{The Cultists Arrive}</i> at the end of the
              scenario. The PCs can compel Feschi to keep quiet with a suitable
              <b>Interpersonal</b> spend.
            </p>
