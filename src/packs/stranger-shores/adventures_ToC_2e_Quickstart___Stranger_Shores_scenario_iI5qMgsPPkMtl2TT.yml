      - type: text
        name: "Scene: Thwarting the Haunter"
        sort: 15000
        _id: 1kA8rfeIt7NrLtZ3
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h2>Thwarting the Haunter</h2>
            <p><b>Scene Type:</b> Conclusion</p>
            <p>
              <b>Lead-Ins:</b>
              @UUID[.1E5OTwV2Al3iDJr0]{Exploring The Wreck}, @UUID[.QKmKYow0BTIoALfM]{The
              Cultists Arrive}
            </p>

            <p>
              To stop the Haunter, the Investigators need to put the gem back in the casket
              – or destroy it. Smashing the gem opens up a temporary space-warp; anyone
              still on the <i>Belle</i> risks being dragged into eldritch dimensions beyond
              space and time.
            </p>

            <p>
              Another option is to knock the <i>Belle</i> off the rocks; any large impact or
              explosion causes the ship to topple over the edge. It takes a few seconds for
              the ship to rip itself free and start to slide; investigators on the ship can
              make <b>Athletics</b> or <b>Fleeing</b>
              tests to escape with their lives. Anyone on board when the ship goes over the
              edge is killed.
            </p>

            <aside>
              <h4>Ongoing Investigations</h4>
              <p>
                If you want to use this adventure as the introduction to a longer campaign,
                you can develop the following threads:
              </p>
              <ul>
                <li>
                  Where was the <i>Belle</i> coming from? Where did she pick up the occult
                  collection?
                </li>
                <li>
                  Where did the Starry Wisdom sect re-establish itself after they were
                  driven out of Providence?
                </li>
                <li>And what do they want with the ‘eye of Thoth- Hermes’?</li>
              </ul>
            </aside>
