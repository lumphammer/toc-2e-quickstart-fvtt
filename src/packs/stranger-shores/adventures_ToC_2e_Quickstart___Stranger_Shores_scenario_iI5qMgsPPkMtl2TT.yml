name: ToC 2e Quickstart & Stranger Shores scenario
img: modules/toc-2e-quickstart/assets/TOC_2e%20Quickstart_cover.webp
caption: |-
  The <i>Trail of Cthulhu 2nd edition</i> QuickStart, including:
  <ul>
    <li>The <b>QuickStart document</b> as a Journal!</li>
    <li>The sample scenario <b><i>Stranger Shores</i></b> including <b>PC</b> and <b>GMC</b> actors!</li>
    <li>A new <b>rules preset</b> and a <b>new theme</b> for the GUMSHOE System!</li>
  </ul>
sort: 100000
description: >-
  <p>The freighter Belle ran aground on the rocky shore near Brenton Point,
  Rhode Island two months ago. There were no survivors, and the ship’s remained
  perched on the rocks ever since as the authorities argue over who’s
  responsible for removing the wreck. While they bicker, something unwholesome
  is festering on board the rotting ship…</p>
