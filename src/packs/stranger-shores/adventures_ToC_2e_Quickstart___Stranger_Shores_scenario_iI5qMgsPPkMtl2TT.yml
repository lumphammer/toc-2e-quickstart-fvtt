        image: {}
        text:
          format: 1
          content: |-
            <h2>The Box</h2>

            <p><b>Scene Type:</b> Alternate</p>
            <p>
              <b>Lead-Ins:</b>
              @UUID[.qPAsm6kx1rBmEhnd]{Getting to the Wreck}
            </p>
            <p>
              <b>Lead-Outs:</b>
              @UUID[.1E5OTwV2Al3iDJr0]{Exploring The Wreck},
              @UUID[.1kA8rfeIt7NrLtZ3]{Thwarting the Haunter}
            </p>

            <p>
              Climbing down to the box is more dangerous, requiring another
              <b>Athletics</b> test (Difficulty 6 – and here, failure means a damaging fall
              and likely drowning). The Investigators could use a <b>Preparedness</b> test
              (Difficulty 4) to see if they remembered to bring a rope, or come back later
              with a boat and approach by sea.
            </p>
            <p>
              The box is a heavy metal casket, marked with a strange inscription. It was
              padlocked shut, but the lock’s broken. The padlock’s obviously a modern
              addition; someone drilled holes into the antique casket to fit a lock.
            </p>

            <ul>
              <li>
                <b>Languages:</b> The inscription’s in Persian. With time (or a 1-point
                <b>Languages</b> or <b>Occult</b> spend to work it out immediately), the
                Investigator can translate the inscription. It talks about this being a
                ‘casket of darkness’ and called upon the gods to ‘drive away chaos’.
              </li>
              <li><b>Chemistry:</b> The box’s lined with thin panels of lead.</li>
            </ul>

            <p>
              This box can be used to contain the gemstone and its power, banishing the
              Haunter of the Wreck.
            </p>
