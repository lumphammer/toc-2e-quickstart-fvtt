      - type: text
        name: "Scene: Starting the Adventure"
        sort: 3000
        _id: eD7EBK0ylZwjBsth
        system: {}
        title:
          show: true
          level: 1
        image: {}
        text:
          format: 1
          content: |-
            <h2>Starting the adventure</h2>
            <p>
              <strong>Scene Type:</strong>
              Introduction
            </p>
            <p>
              <strong>Lead-Outs:</strong>
              @UUID[.GvSSDACo0XHoG4N7]{Background Research},
              @UUID[.qPAsm6kx1rBmEhnd]{Getting to the Wreck}
            </p>
            <p>
              Depending on the Investigators and their Drives, the Game Moderator picks an
              appropriate hook. Possible starting points – and the clues that point the
              Investigators towards the wrecked ship – include:
            </p>
            <ul>
              <li>
                The Grissoms, a family holidaying in a beach house outside Newport, complain
                about strange nocturnal apparitions that terrified their children. They
                describe something flapping around the house that glowed with an unearthly
                blue light (see
                <i>
                  @UUID[.1E5OTwV2Al3iDJr0#the-haunter-of-the-wreck]{The Haunter of the
                  Wreck}
                </i>
                )
                <ul>
                  <li>
                    <strong>(core clue) Reassurance</strong>
                    gets young Eustace Grissom to admit that the apparitions started after
                    he threw stones at the nearby wrecked ship. (See
                    <i>@UUID[.qPAsm6kx1rBmEhnd]{Getting to the Wreck}</i>
                    )
                  </li>
                </ul>
              </li>

              <li>
                <strong>(core clue)</strong>
                An Investigator with
                <strong>Astronomy</strong>
                spots strange electric-blue lights in the sky in the vicinity of the wreck.
              </li>
              <li>
                <strong>(core clue) Streetwise</strong>
                picks up a rumour that the
                <em>Belle</em>
                was smuggling gold – and that the treasure wasn’t found after the shipwreck.
                Maybe there’s still something valuable on the wreck or on the shore
                nearby...
              </li>
              <li>
                A representative of an insurance company hires the Investigators to look
                into the circumstances of the shipwreck.
              </li>
            </ul>
